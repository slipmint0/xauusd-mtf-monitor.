name: Live Gold Monitor Cron

on:
  schedule:
    # Triggers every 15 minutes automatically
    - cron: '*/15 * * * *'
  workflow_dispatch: # Allows you to manually trigger it anytime for testing

jobs:
  run-monitor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Execute Factual Calculations
        env:
          GOLD_API_KEY: ${{ secrets.GOLD_API_KEY }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python -c "
          import sys
          sys.path.append('.')
          from api.monitor import handler
          print(handler(None))
          "
